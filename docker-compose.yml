services:
  mariadb:
    image: bitnami/mariadb:latest
    container_name: moodle_mariadb
    restart: unless-stopped
    environment:
      - MARIADB_ROOT_PASSWORD=rootpassword
      - MARIADB_USER=moodle
      - MARIADB_PASSWORD=moodlepassword
      - MARIADB_DATABASE=moodle
      - MARIADB_CHARACTER_SET=utf8mb4
      - MARIADB_COLLATE=utf8mb4_unicode_ci
    volumes:
      - mariadb_data:/bitnami/mariadb
    ports:
      - "3306:3306"
    networks:
      - db_net

  jobe1:
    build:
      context: .
      dockerfile: Dockerfile.jobe
    container_name: moodle_jobe1
    restart: unless-stopped
    hostname: jobe1
    ports:
      - "4001:80"
    networks:
      - jobe_net

  jobe2:
    build:
      context: .
      dockerfile: Dockerfile.jobe
    container_name: moodle_jobe2
    restart: unless-stopped
    hostname: jobe2
    ports:
      - "4002:80"
    networks:
      - jobe_net

  moodle:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: moodle_app
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      - MOODLE_WWWROOT=http://localhost:8080
      - MOODLE_DB_HOST=mariadb
      - MOODLE_DB_PORT=3306
      - MOODLE_DB_NAME=moodle
      - MOODLE_DB_USER=moodle
      - MOODLE_DB_PASSWORD=moodlepassword
      - MOODLE_ADMIN_USER=admin
      - MOODLE_ADMIN_PASSWORD=AdminPassword123!
      - MOODLE_ADMIN_EMAIL=admin@example.com
      - JOBE_HOST=${JOBE_HOST:-jobe1;jobe2}
      # Cấu hình local_testcase_exchange; có thể override bằng file .env.
      - TESTCASE_DB_HOST=${TESTCASE_DB_HOST:-mariadb}
      - TESTCASE_DB_PORT=${TESTCASE_DB_PORT:-3306}
      - TESTCASE_DB_NAME=${TESTCASE_DB_NAME:-testcase_store}
      - TESTCASE_DB_USER=${TESTCASE_DB_USER:-moodle_app_writer}
      - TESTCASE_DB_PASSWORD=${TESTCASE_DB_PASSWORD:-JobeSecret123!}
      - TESTCASE_JOBE_SERVERS=${TESTCASE_JOBE_SERVERS:-jobe1;jobe2}
      - TESTCASE_JOBE_API_KEY=${TESTCASE_JOBE_API_KEY:-}
    volumes:
      - moodledata:/var/www/moodledata
      - ./local_testcase_exchange:/var/www/html/local/testcase_exchange
      - ./quizaccess_testcaseexchange:/var/www/html/mod/quiz/accessrule/testcaseexchange
      - ./testcase_dashboard.php:/var/www/html/testcase_dashboard.php
    depends_on:
      - mariadb
      - jobe1
      - jobe2
    networks:
      - db_net
      - jobe_net

volumes:
  mariadb_data:
  moodledata:

networks:
  db_net:
    driver: bridge
  jobe_net:
    driver: bridge
