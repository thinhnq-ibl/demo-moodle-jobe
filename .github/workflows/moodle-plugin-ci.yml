name: Moodle plugin CI

on:
  push:
    paths:
      - 'local_testcase_exchange/**'
      - '.github/workflows/moodle-plugin-ci.yml'
  pull_request:
    paths:
      - 'local_testcase_exchange/**'
      - '.github/workflows/moodle-plugin-ci.yml'

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - moodle: MOODLE_403_STABLE
            php: '8.2'
          - moodle: MOODLE_404_STABLE
            php: '8.2'
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: 'yes'
          MARIADB_DATABASE: moodle
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          path: source
          persist-credentials: false

      - name: Prepare standalone plugin tree
        run: cp -R source/local_testcase_exchange plugin

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, zip, gd, soap, intl
          ini-values: max_input_vars=5000
          coverage: none

      - name: Install Moodle Plugin CI
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo "$(cd ci/bin && pwd)" >> "$GITHUB_PATH"
          echo "$(cd ci/vendor/bin && pwd)" >> "$GITHUB_PATH"
          sudo locale-gen en_AU.UTF-8

      - name: Install Moodle and dependencies
        env:
          MOODLE_BRANCH: ${{ matrix.moodle }}
        run: |
          moodle-plugin-ci add-plugin --clone https://github.com/trampgeek/moodle-qtype_coderunner.git
          moodle-plugin-ci add-plugin --clone https://github.com/trampgeek/moodle-qbehaviour_adaptive_adapted_for_coderunner.git
          moodle-plugin-ci install --plugin ./plugin --db-type=mysqli --db-host=127.0.0.1 --db-user=root --db-pass='' --db-name=moodle

      - name: Static checks
        run: |
          moodle-plugin-ci phplint
          moodle-plugin-ci validate
          moodle-plugin-ci savepoints
          moodle-plugin-ci phpcs --max-warnings 0
          moodle-plugin-ci phpdoc

      - name: PHPUnit
        run: moodle-plugin-ci phpunit --fail-on-warning
